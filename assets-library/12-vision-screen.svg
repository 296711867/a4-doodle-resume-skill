<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254">
  <!-- 12 视觉检测屏 · 复刻自素材 16_06_02-4(黑底,显示器内图片+黄四角框 → 虚线 → AI芯片六黄端子) -->
  <style>
    .draw { stroke-dasharray: 1; }
    @media (prefers-reduced-motion: no-preference) {
    .draw { animation: draw-in .7s cubic-bezier(.45,0,.35,1) var(--d,0ms) both; }
    .dfill { animation: draw-in .9s cubic-bezier(.45,0,.35,1) var(--d,0ms) both, fill-in .5s ease calc(var(--d,0ms) + 300ms) both; }
    .fade { animation: fade-in .6s ease var(--d,0ms) both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop-o .3s ease var(--d,0ms) both, pop-t .45s cubic-bezier(.34,1.56,.64,1) var(--d,0ms) both; }
    @keyframes draw-in { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes fill-in { from { fill-opacity: 0; } to { fill-opacity: 1; } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop-o { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop-t { from { transform: scale(.4); } to { transform: scale(1); } }
    .ball { transform-box: fill-box; transform-origin: center; animation: ball 2.2s ease-in-out infinite alternate; }
    @keyframes ball { from { transform: scale(1); } to { transform: scale(1.22); } }
    .bracket { animation: bracket 2.8s ease-in-out infinite; }
    @keyframes bracket { 0%,32%,100% { opacity: 1; } 8%,24% { opacity: .15; } }
    .dash { animation: march 1.8s linear infinite; }
    @keyframes march { from { stroke-dashoffset: var(--p,.1); } to { stroke-dashoffset: 0; } }
    .lp1 { animation-delay: -.9s; } .lp2 { animation-delay: -1.5s; }
    }
    @media print { * { animation: none !important; } }
  </style>
  <g id="scene" fill="none" stroke="#141414" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- 虚线连接 -->
    <g class="fade" style="--d:900ms;--p:.075"><path class="dash" pathLength="1" stroke="#d8d8d2" stroke-width="5" stroke-dasharray="0.03 0.045" d="M 760 540 Q 850 572 900 650"/></g>
    <!-- 显示器 -->
    <path class="dfill" style="--d:300ms" pathLength="1" fill="#fff" d="M 440 816 L 514 816 L 534 866 L 420 866 Z"/>
    <ellipse class="dfill" style="--d:380ms" pathLength="1" cx="477" cy="888" rx="121" ry="26" fill="#fff"/>
    <rect class="dfill" style="--d:0ms" pathLength="1" x="201" y="426" width="553" height="388" rx="28" fill="#fff"/>
    <rect class="draw" style="--d:220ms" pathLength="1" x="233" y="468" width="481" height="311" rx="14" fill="#fff"/>
    <!-- 屏内图片 + 检测角框 -->
    <circle class="pop" style="--d:420ms" cx="416" cy="569" r="29" fill="#F6CB43" stroke="none"/>
    <path class="draw" style="--d:480ms" pathLength="1" stroke-width="9" d="M 300 723 L 395 628 L 448 676 L 540 596 L 655 723 M 300 726 L 655 726"/>
    <g class="bracket" stroke="#F6CB43" stroke-width="14">
      <path class="fade" style="--d:700ms" d="M 341 501 L 305 501 Q 289 501 289 517 L 289 551"/>
      <path class="fade" style="--d:780ms" d="M 606 501 L 642 501 Q 658 501 658 517 L 658 551"/>
      <path class="fade" style="--d:860ms" d="M 341 697 L 305 697 Q 289 697 289 681 L 289 647"/>
      <path class="fade" style="--d:940ms" d="M 606 696 L 642 696 Q 658 696 658 680 L 658 646"/>
    </g>
    <!-- AI 芯片 -->
    <g stroke="#d8d8d2" stroke-width="10">
      <path class="draw" style="--d:560ms" pathLength="1" d="M 918 674 L 918 713 M 989 673 L 989 712"/>
      <path class="draw" style="--d:600ms" pathLength="1" d="M 920 832 L 920 871 M 991 831 L 991 870"/>
      <path class="draw" style="--d:640ms" pathLength="1" d="M 840 767 L 883 767"/>
      <path class="draw" style="--d:680ms" pathLength="1" d="M 1022 767 L 1065 767"/>
    </g>
    <rect class="dfill" style="--d:500ms" pathLength="1" x="885" y="715" width="135" height="115" rx="26" fill="#fff"/>
    <path class="draw" style="--d:720ms" pathLength="1" stroke="#141414" stroke-width="8" d="M 921 796 Q 930 762 944 727 Q 956 762 964 796 M 928 773 Q 942 769 956 773 M 977 728 Q 975 763 978 796"/>
    <g class="ball"><circle class="pop" style="--d:800ms" cx="918" cy="650" r="10" fill="#F6CB43" stroke="none"/></g>
    <g class="ball lp1"><circle class="pop" style="--d:840ms" cx="989" cy="649" r="10" fill="#F6CB43" stroke="none"/></g>
    <g class="ball lp2"><circle class="pop" style="--d:880ms" cx="920" cy="895" r="10" fill="#F6CB43" stroke="none"/></g>
    <g class="ball"><circle class="pop" style="--d:920ms" cx="991" cy="893" r="10" fill="#F6CB43" stroke="none"/></g>
    <circle class="pop" style="--d:960ms" cx="808" cy="767" r="10" fill="#F6CB43" stroke="none"/>
    <circle class="pop" style="--d:1000ms" cx="1096" cy="770" r="10" fill="#F6CB43" stroke="none"/>
  </g>
</svg>
