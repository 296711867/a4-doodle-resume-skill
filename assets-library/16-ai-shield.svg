    <circle class="pop" style="--d:1360ms" cx="772" cy="729" r="10" fill="#F6CB43" stroke="none"/>
    <circle class="pop" style="--d:1390ms" cx="898" cy="802" r="9" fill="#F6CB43" stroke="none"/>
    <circle class="pop" style="--d:1420ms" cx="625" cy="792" r="10" fill="#F6CB43" stroke="none"/>
    <circle class="pop" style="--d:1450ms" cx="625" cy="852" r="9" fill="#F6CB43" stroke="none"/>
