    <!-- 浏览器图表卡(左上) -->
    <g class="breathe">
      <rect class="dfill" style="--d:250ms" pathLength="1" x="112" y="265" width="294" height="262" rx="20" fill="#fff"/>
      <path class="draw" style="--d:350ms" pathLength="1" stroke-width="6" d="M 114 317 L 404 317"/>
      <circle class="pop" style="--d:400ms" cx="144" cy="291" r="8" fill="#F6CB43" stroke="none"/>
      <circle class="pop" style="--d:430ms" cx="176" cy="291" r="7" fill="#141414" stroke="none"/>
      <circle class="pop" style="--d:460ms" cx="208" cy="291" r="7" fill="#141414" stroke="none"/>
