      <rect class="pop" style="--d:530ms" x="192" y="428" width="26" height="64" rx="4" fill="#fff" stroke-width="5"/>
      <g class="ball"><rect class="pop" style="--d:560ms" x="234" y="404" width="26" height="88" rx="4" fill="#F6CB43" stroke-width="5"/></g>
      <path class="draw" style="--d:600ms" pathLength="1" stroke-width="7" d="M 290 420 L 376 419 M 290 450 L 376 449 M 290 480 L 350 480"/>
    </g>
    <!-- 文档卡+黄盾(右上) -->
    <g class="breathe lp1">
      <rect class="dfill" style="--d:350ms" pathLength="1" x="928" y="284" width="206" height="244" rx="14" fill="#fff"/>
      <path class="draw" style="--d:450ms" pathLength="1" stroke-width="5" d="M 1056 286 L 1132 362 L 1056 362"/>
      <path class="draw" style="--d:500ms" pathLength="1" stroke-width="7" d="M 950 340 L 1026 340 M 950 375 L 1026 375 M 950 410 L 1026 410 M 950 445 L 1000 445"/>
      <path class="pop" style="--d:560ms" d="M 1052 420 L 1108 420 L 1108 468 Q 1108 500 1080 512 Q 1052 500 1052 468 Z" fill="#F6CB43" stroke="none"/>
