      <rect class="pop" style="--d:580ms" x="140" y="747" width="46" height="46" rx="10" fill="#F6CB43" stroke-width="6"/>
      <path class="draw" style="--d:640ms" pathLength="1" stroke-width="6" d="M 150 770 L 161 781 L 180 757"/>
      <path class="draw" style="--d:680ms" pathLength="1" stroke-width="7" d="M 210 762 L 330 761 M 210 790 L 330 789"/>
      <rect class="pop" style="--d:720ms" x="140" y="827" width="46" height="46" rx="10" fill="#fff" stroke-width="6"/>
      <path class="draw" style="--d:760ms" pathLength="1" stroke-width="7" d="M 210 842 L 330 841 M 210 870 L 330 869"/>
      <rect class="pop" style="--d:800ms" x="140" y="907" width="46" height="46" rx="10" fill="#fff" stroke-width="6"/>
      <path class="draw" style="--d:840ms" pathLength="1" stroke-width="7" d="M 210 922 L 330 921 M 210 950 L 330 949"/>
    </g>
    <!-- 放大镜(右下) -->
    <g class="breathe">
      <circle class="dfill" style="--d:550ms" pathLength="1" cx="1024" cy="796" r="95" fill="#fff"/>
      <circle class="draw" style="--d:650ms" pathLength="1" cx="1024" cy="796" r="70" fill="#fff"/>
      <rect class="pop" style="--d:700ms" x="986" y="808" width="16" height="38" rx="3" fill="#fff" stroke-width="5"/>
      <rect class="pop" style="--d:730ms" x="1012" y="788" width="16" height="58" rx="3" fill="#fff" stroke-width="5"/>
      <g class="ball lp1"><rect class="pop" style="--d:760ms" x="1038" y="768" width="16" height="78" rx="3" fill="#F6CB43" stroke-width="5"/></g>
      <path class="draw" style="--d:700ms" pathLength="1" stroke-width="5" d="M 978 850 L 1070 850"/>
      <path class="draw" style="--d:800ms" pathLength="1" stroke="#d8d8d2" stroke-width="30" d="M 1096 868 L 1148 920"/>
    </g>
    <!-- 数据库(底) -->
    <g class="breathe lp1">
      <path class="dfill" style="--d:600ms" pathLength="1" fill="#fff" d="M 538 902 L 538 1038 Q 538 1066 625 1066 Q 712 1066 712 1038 L 712 902"/>
      <ellipse class="dfill" style="--d:600ms" pathLength="1" cx="625" cy="902" rx="87" ry="26" fill="#fff"/>
      <path class="draw" style="--d:700ms" pathLength="1" d="M 538 956 Q 538 984 625 984 Q 712 984 712 956 M 538 1010 Q 538 1038 625 1038 Q 712 1038 712 1010"/>
      <circle class="pop" style="--d:760ms" cx="696" cy="935" r="6" fill="#F6CB43" stroke="none"/>
      <circle class="pop" style="--d:790ms" cx="696" cy="988" r="6" fill="#F6CB43" stroke="none"/>
      <circle class="pop" style="--d:820ms" cx="696" cy="1040" r="6" fill="#F6CB43" stroke="none"/>
    </g>
    <!-- 安全盾 -->
    <path class="dfill" style="--d:0ms" pathLength="1" fill="#fff" d="M 504 465 L 746 465 Q 754 465 754 473 L 754 556 Q 754 686 625 762 Q 496 686 496 556 L 496 473 Q 496 465 504 465 Z"/>
    <path class="draw" style="--d:300ms" pathLength="1" stroke="#141414" stroke-width="11" d="M 578 600 Q 592 545 614 490 Q 634 545 648 600 M 590 568 Q 612 562 636 568 M 672 492 Q 668 548 674 600"/>
    <g class="ball"><circle class="pop" style="--d:450ms" cx="625" cy="672" r="38" fill="#F6CB43" stroke="#141414" stroke-width="6"/></g>
    <path class="draw" style="--d:560ms" pathLength="1" stroke="#141414" stroke-width="8" d="M 607 672 L 620 686 L 646 656"/>
    <g class="spark" stroke="#F6CB43" stroke-width="13">
      <path class="fade" style="--d:1400ms" d="M 702 466 L 728 438 M 738 420 L 762 392 M 772 468 L 794 446"/>
    </g>
    <!-- 黄端子 ×11 -->
    <g class="ball lp1"><circle class="pop" style="--d:1150ms" cx="626" cy="410" r="11" fill="#F6CB43" stroke="none"/></g>
    <circle class="pop" style="--d:1180ms" cx="434" cy="366" r="9" fill="#F6CB43" stroke="none"/>
