<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254">
  <!-- 02 API 架构 · 复刻自素材 ChatGPT 图 2(服务器×3 → API ← 数据库,齿轮+黄火花,天线双黄球) -->
  <style>
    @media (prefers-reduced-motion: no-preference) {
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; }
    .pop { transform: scale(0.4); opacity: 0; transform-box: fill-box; transform-origin: center; }
    .fade { opacity: 0; }
    .dfill { fill-opacity: 0; }
      .draw { transition: stroke-dashoffset 0.7s cubic-bezier(0.45,0,0.35,1) var(--d,0ms); }
      .in .draw { stroke-dashoffset: 0; }
      .dfill { transition: stroke-dashoffset 0.9s cubic-bezier(0.45,0,0.35,1) var(--d,0ms), fill-opacity 0.5s ease calc(var(--d,0ms) + 300ms); }
      .in .dfill { fill-opacity: 1; }
      .fade { transition: opacity 0.6s ease var(--d,0ms); }
      .in .fade { opacity: 1; }
      .pop { transition: opacity 0.3s ease var(--d,0ms), transform 0.45s cubic-bezier(0.34,1.56,0.64,1) var(--d,0ms); }
      .in .pop { opacity: 1; transform: scale(1); }
      .in .spin { transform-box: fill-box; transform-origin: center; animation: spin 12s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .in .tw { animation: twinkle 2.2s ease-in-out infinite; }
      .in .tw.t2 { animation-delay: -0.7s; }
      .in .tw.t3 { animation-delay: -1.4s; }
      @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
      .in .led { animation: ledblink 1.8s ease-in-out infinite; }
      .in .led.l2 { animation-delay: -0.6s; }
      .in .led.l3 { animation-delay: -1.2s; }
      @keyframes ledblink { 0%,70%,100% { opacity: 1; } 85% { opacity: 0.15; } }
      .in .pulse { animation: pulse-run 3.2s linear infinite; }
      .in .pulse.p2 { animation-duration: 3.6s; }
      @keyframes pulse-run { to { stroke-dashoffset: -115; } }
    }
    @media print {
      .draw, .dfill { stroke-dashoffset: 0 !important; }
      .fade, .pop { opacity: 1 !important; transform: none !important; }
      .dfill { fill-opacity: 1 !important; }
    }
  </style>
  <rect width="1254" height="1254" fill="#050505" />
  <g id="scene">
  <!-- 服务器×3(白填充黑描边,黄 LED) -->
  <g fill="none" stroke="#141414" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path class="draw" style="--d:0ms" pathLength="1" fill="#fff" d="M 100 452 Q 226 445 352 452 L 364 488 Q 226 480 88 488 Z" />
    <rect class="dfill draw" style="--d:100ms" pathLength="1" x="89" y="492" width="273" height="78" rx="12" fill="#fff" />
    <rect class="dfill draw" style="--d:200ms" pathLength="1" x="91" y="598" width="268" height="70" rx="12" fill="#fff" />
    <rect class="dfill draw" style="--d:300ms" pathLength="1" x="93" y="692" width="264" height="70" rx="12" fill="#fff" />
    <path class="draw" style="--d:380ms" pathLength="1" stroke-width="5" d="M 128 574 L 300 572 M 130 668 L 298 666 M 132 760 L 296 758" />
    <path class="fade" style="--d:430ms" stroke-width="5" d="M 240 552 L 296 551 M 240 650 L 294 649 M 242 745 L 292 744" />
    <circle class="pop led" style="--d:460ms" cx="123" cy="532" r="8" fill="#F6CB43" stroke="none" />
    <circle class="pop led l2" style="--d:490ms" cx="125" cy="633" r="8" fill="#F6CB43" stroke="none" />
    <circle class="pop led l3" style="--d:520ms" cx="126" cy="728" r="8" fill="#F6CB43" stroke="none" />
    <path class="fade" style="--d:420ms" stroke-width="5" d="M 240 532 L 318 531 M 240 633 L 316 632 M 242 728 L 314 727" />

    <!-- 数据库 -->
    <ellipse class="draw" style="--d:500ms" pathLength="1" cx="1067" cy="518" rx="97" ry="28" fill="#fff" />
    <path fill="#fff" stroke="none" d="M 970 518 L 970 745 Q 1067 770 1164 745 L 1164 518 Q 1067 540 970 518 Z" />
    <path class="draw" style="--d:580ms" pathLength="1" d="M 970 518 Q 968 585 971 656 M 1164 518 Q 1166 585 1163 656" />
    <path class="draw" style="--d:640ms" pathLength="1" stroke-width="5" d="M 970 570 Q 1067 592 1164 568" />
    <path class="draw" style="--d:700ms" pathLength="1" d="M 968 598 Q 966 650 970 702 M 1166 598 Q 1168 650 1164 702" />
    <path class="draw" style="--d:740ms" pathLength="1" stroke-width="5" d="M 969 648 Q 1067 670 1165 646" />
    <path class="draw" style="--d:780ms" pathLength="1" d="M 966 668 Q 964 710 970 745 Q 1067 772 1162 745 Q 1166 710 1164 668" />
    <circle class="pop led" style="--d:820ms" cx="1136" cy="580" r="7" fill="#F6CB43" stroke="none" />
    <circle class="pop led l2" style="--d:850ms" cx="1136" cy="646" r="7" fill="#F6CB43" stroke="none" />
    <circle class="pop led l3" style="--d:880ms" cx="1139" cy="709" r="6" fill="#F6CB43" stroke="none" />

    <!-- API 盒(双天线黄球) -->
    <path class="draw" style="--d:900ms" pathLength="1" stroke-width="5" d="M 612 520 Q 616 480 620 462 M 696 522 Q 698 490 696 468" />
    <circle class="pop" style="--d:980ms" cx="621" cy="455" r="13" fill="#F6CB43" stroke-width="4" />
    <circle class="pop" style="--d:1010ms" cx="696" cy="470" r="10" fill="#F6CB43" stroke-width="4" />
    <rect class="dfill draw" style="--d:1050ms" pathLength="1" x="526" y="524" width="261" height="173" rx="26" fill="#fff" />
    <text class="fade" style="--d:1200ms" x="656" y="636" text-anchor="middle" font-size="86" font-weight="700"
      font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" fill="#141414" stroke="none">API</text>

    <!-- 虚线箭头 + 黄脉冲 -->
    <path class="fade" style="--d:1300ms" stroke="#d8d8d2" stroke-width="5" stroke-dasharray="14 16" d="M 386 606 Q 455 600 514 604" />
    <path class="fade" style="--d:1340ms" stroke="#d8d8d2" stroke-width="5" d="M 514 604 L 496 590 M 514 604 L 496 616" />
    <path class="fade pulse" style="--d:1420ms" stroke="#F6CB43" stroke-width="6.5" pathLength="100" stroke-dasharray="0.01 11" d="M 386 606 Q 455 600 514 604" />
    <path class="fade" style="--d:1380ms" stroke="#d8d8d2" stroke-width="5" stroke-dasharray="14 16" d="M 940 602 Q 875 606 802 604" />
    <path class="fade" style="--d:1420ms" stroke="#d8d8d2" stroke-width="5" d="M 802 604 L 820 590 M 802 604 L 820 616" />
    <path class="fade pulse p2" style="--d:1460ms" stroke="#F6CB43" stroke-width="6.5" pathLength="100" stroke-dasharray="0.01 11" d="M 940 602 Q 875 606 802 604" />
    <path class="fade" style="--d:1500ms" stroke="#d8d8d2" stroke-width="5" stroke-dasharray="14 16" d="M 655 840 Q 650 790 654 716" />
    <path class="fade" style="--d:1540ms" stroke="#d8d8d2" stroke-width="5" d="M 654 716 L 640 732 M 654 716 L 668 730" />
    <path class="fade pulse" style="--d:1580ms" stroke="#F6CB43" stroke-width="6.5" pathLength="100" stroke-dasharray="0.01 11" d="M 655 840 Q 650 790 654 716" />

    <!-- 齿轮(一体轮廓,旋转)+ 黄火花 -->
    <g class="spin">
      <path class="dfill draw" style="--d:1600ms" pathLength="1" fill="#fff" stroke-width="6"
        d="M 731.0 932.2 Q 739.0 945.0 731.0 957.8 L 706.5 958.0 A 58 58 0 0 1 699.2 975.7 L 716.3 993.2 Q 712.9 1007.9 698.2 1011.3 L 680.7 994.2 A 58 58 0 0 1 663.0 1001.5 L 662.8 1026.0 Q 650.0 1034.0 637.2 1026.0 L 637.0 1001.5 A 58 58 0 0 1 619.3 994.2 L 601.8 1011.3 Q 587.1 1007.9 583.7 993.2 L 600.8 975.7 A 58 58 0 0 1 593.5 958.0 L 569.0 957.8 Q 561.0 945.0 569.0 932.2 L 593.5 932.0 A 58 58 0 0 1 600.8 914.3 L 583.7 896.8 Q 587.1 882.1 601.8 878.7 L 619.3 895.8 A 58 58 0 0 1 637.0 888.5 L 637.2 864.0 Q 650.0 856.0 662.8 864.0 L 663.0 888.5 A 58 58 0 0 1 680.7 895.8 L 698.2 878.7 Q 712.9 882.1 716.3 896.8 L 699.2 914.3 A 58 58 0 0 1 706.5 932.0 Z" />
      <circle class="pop" style="--d:1780ms" cx="650" cy="945" r="22" fill="#fff" stroke-width="6" />
    </g>
    <g class="tw fade" style="--d:1700ms" stroke="#F6CB43" stroke-width="13" stroke-linecap="round">
      <path d="M 756 830 L 768 812" />
    </g>
    <g class="tw t2 fade" style="--d:1740ms" stroke="#F6CB43" stroke-width="13" stroke-linecap="round">
      <path d="M 776 868 L 800 872" />
    </g>
    <g class="tw t3 fade" style="--d:1780ms" stroke="#F6CB43" stroke-width="12" stroke-linecap="round">
      <path d="M 782 908 L 802 910" />
    </g>
  </g>
  </g>
  <script>
    (function () {
      var scene = document.getElementById('scene');
      var go = function () { scene.classList.add('in'); };
      if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
    })();
  </script>
</svg>
