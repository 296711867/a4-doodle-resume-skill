      <path class="draw" style="--d:1100ms" pathLength="1" d="M 660 681 L 666 681 Q 672 681 672 687 L 672 752 Q 672 758 666 758 L 660 758"/>
    </g>
    <!-- 黄粗弯箭头 -->
