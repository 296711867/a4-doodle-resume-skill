    <path class="draw" style="--d:1720ms" pathLength="1" stroke-width="22" d="M 1230 660 Q 1220 706 1192 730"/>
    <rect class="pop" style="--d:1760ms" x="976" y="686" width="16" height="60" rx="6" fill="#F6CB43" stroke="none"/>
    <rect class="pop" style="--d:1790ms" x="1158" y="686" width="16" height="60" rx="6" fill="#F6CB43" stroke="none"/>
    <g class="spark lp1" stroke="#F6CB43" stroke-width="11">
