    </g>
    <g class="fade" style="--d:1020ms"><path class="dash" pathLength="1" stroke-width="6" stroke-dasharray="0.05 0.05" d="M 698 612 L 668 644"/></g>
    <g class="bracket lp1" stroke="#F6CB43" stroke-width="11">
