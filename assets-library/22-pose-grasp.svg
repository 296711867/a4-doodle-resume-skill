      <path class="draw" style="--d:220ms" pathLength="1" d="M 150 538 L 150 570 M 193 538 L 193 570 M 236 538 L 236 570"/>
      <path class="draw" style="--d:260ms" pathLength="1" d="M 83 434 L 117 434 M 83 510 L 117 510 M 248 434 L 282 434 M 248 510 L 282 510"/>
