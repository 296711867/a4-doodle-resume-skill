<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254">
  <!-- 06 开发工位 · 复刻自素材 ChatGPT 图 6(代码笔记本+暗代码浮窗+</>浮窗+黄叶盆栽+咖啡+黄贴纸) -->
  <style>
    @media (prefers-reduced-motion: no-preference) {
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; }
    .pop { transform: scale(0.4); opacity: 0; transform-box: fill-box; transform-origin: center; }
    .fade { opacity: 0; }
    .dfill { fill-opacity: 0; }
      .draw { transition: stroke-dashoffset 0.7s cubic-bezier(0.45,0,0.35,1) var(--d,0ms); }
      .in .draw { stroke-dashoffset: 0; }
      .dfill { transition: stroke-dashoffset 0.9s cubic-bezier(0.45,0,0.35,1) var(--d,0ms), fill-opacity 0.5s ease calc(var(--d,0ms) + 300ms); }
      .in .dfill { fill-opacity: 1; }
      .fade { transition: opacity 0.6s ease var(--d,0ms); }
      .in .fade { opacity: 1; }
      .pop { transition: opacity 0.3s ease var(--d,0ms), transform 0.45s cubic-bezier(0.34,1.56,0.64,1) var(--d,0ms); }
      .in .pop { opacity: 1; transform: scale(1); }
      .in .float { animation: float 5s ease-in-out infinite alternate; }
      .in .float.f2 { animation-delay: -2.5s; }
      @keyframes float { from { transform: translateY(-4px); } to { transform: translateY(5px); } }
      .in .steam { animation: puff 2.8s ease-out infinite; }
      .in .steam.s2 { animation-delay: -1.4s; }
      @keyframes puff { 0% { transform: translateY(4px); opacity: 0; } 30% { opacity: 0.85; } 100% { transform: translateY(-18px); opacity: 0; } }
      .in .plant { transform-origin: 196px 836px; animation: sway 5.5s ease-in-out infinite alternate; }
      @keyframes sway { from { transform: rotate(-2.4deg); } to { transform: rotate(2.6deg); } }
      .in .tw { animation: twinkle 2.4s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
      .in .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 3s ease-in-out infinite alternate; }
      @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.08); } }
    }
    @media print {
      .draw, .dfill { stroke-dashoffset: 0 !important; }
      .fade, .pop { opacity: 1 !important; transform: none !important; }
      .dfill { fill-opacity: 1 !important; }
    }
  </style>
  <rect width="1254" height="1254" fill="#050505" />
  <g id="scene">
