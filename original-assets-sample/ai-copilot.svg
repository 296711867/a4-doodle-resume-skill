<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 700" width="1254" height="700">
  <!-- A6 AI 结对编程 · 原创:开发者+笔记本,悬浮 AI 建议卡(ghost text),Tab 接受,光标闪烁 -->
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; }
    .pop { transform: scale(0.4); opacity: 0; transform-box: fill-box; transform-origin: center; }
    .fade { opacity: 0; }
    .dfill { fill-opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .draw { transition: stroke-dashoffset 0.7s cubic-bezier(0.45,0,0.35,1) var(--d,0ms); }
      .in .draw { stroke-dashoffset: 0; }
      .dfill { transition: stroke-dashoffset 0.9s cubic-bezier(0.45,0,0.35,1) var(--d,0ms), fill-opacity 0.5s ease calc(var(--d,0ms) + 300ms); }
      .in .dfill { fill-opacity: 1; }
      .fade { transition: opacity 0.6s ease var(--d,0ms); }
      .in .fade { opacity: 1; }
      .pop { transition: opacity 0.3s ease var(--d,0ms), transform 0.45s cubic-bezier(0.34,1.56,0.64,1) var(--d,0ms); }
      .in .pop { opacity: 1; transform: scale(1); }
      .in .ghost { animation: ghost-breathe 2s ease-in-out infinite alternate; }
      @keyframes ghost-breathe { from { opacity: 0.9; } to { opacity: 0.5; } }
      .in .caret { animation: caret-blink 1.1s steps(1) infinite; }
      @keyframes caret-blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
      .in .bob { animation: bob 5.5s ease-in-out infinite alternate; }
      @keyframes bob { from { transform: translateY(-3px); } to { transform: translateY(4px); } }
      .in .plant { transform-origin: 150px 560px; animation: sway 5.5s ease-in-out infinite alternate; }
      @keyframes sway { from { transform: rotate(-2.4deg); } to { transform: rotate(2.6deg); } }
      .in .steam { animation: steamup 2.8s ease-out infinite; }
      .in .steam.s2 { animation-delay: -1.4s; }
      @keyframes steamup { 0% { transform: translateY(3px); opacity: 0; } 30% { opacity: 0.8; } 100% { transform: translateY(-12px); opacity: 0; } }
      .in .spark { animation: sparktw 2.2s ease-in-out infinite; }
      .in .spark.s2 { animation-delay: -0.7s; }
      .in .spark.s3 { animation-delay: -1.4s; }
      @keyframes sparktw { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    }
  </style>
  <g id="scene-A6">
  <g fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- 编辑器窗口 -->
    <rect class="dfill draw" style="--d:0ms" pathLength="1" x="180" y="90" width="760" height="470" rx="18" fill="#fff" stroke-width="4" />
    <path class="draw" style="--d:160ms" pathLength="1" stroke-width="3" d="M 182 146 Q 560 142 938 146" />
    <circle class="pop" style="--d:240ms" cx="216" cy="118" r="7" fill="#F6CB43" stroke="none" />
    <circle class="pop" style="--d:270ms" cx="244" cy="118" r="7" fill="#fff" stroke-width="2.6" />
    <circle class="pop" style="--d:300ms" cx="272" cy="118" r="7" fill="#fff" stroke-width="2.6" />
    <text class="fade" style="--d:340ms" x="560" y="126" text-anchor="middle" font-size="20" font-family="inherit" fill="#141414" stroke="none">model.py — AI coding</text>

    <!-- 代码行(打字机) -->
    <g class="fade" stroke-width="4">
      <path style="--d:420ms" d="M 230 190 L 320 188 M 336 187 L 420 185 M 230 220 L 380 218" />
      <path style="--d:500ms" d="M 256 250 L 356 248 M 372 247 L 500 245 M 256 280 L 420 278" />
      <path style="--d:580ms" d="M 256 310 L 340 308 M 356 307 L 448 305 M 256 340 L 396 338" />
      <path style="--d:660ms" d="M 282 370 L 420 368 M 436 367 L 560 365" />
    </g>
    <!-- AI ghost 建议(灰虚)+ 接受片段(黄) -->
    <g class="ghost">
      <path class="fade" style="--d:720ms" stroke="#8f8f85" stroke-width="3.4" stroke-dasharray="12 8" d="M 476 364 L 620 362 M 282 400 L 500 398 M 516 397 L 640 395" />
    </g>
    <rect class="fade" style="--d:760ms" x="628" y="356" width="230" height="70" rx="10" fill="#F6CB43" opacity="0.4" stroke="none" />
    <path class="fade caret" style="--d:800ms" stroke-width="3.4" d="M 468 352 L 468 376" />
    <!-- Tab 提示徽章 -->
    <g class="pop" style="--d:840ms">
      <rect x="700" y="430" width="120" height="34" rx="10" fill="#fff" stroke-width="2.8" />
      <text x="760" y="453" text-anchor="middle" font-size="18" font-weight="700" font-family="inherit" fill="#141414" stroke="none">Tab ⏎</text>
    </g>
    <path class="fade" style="--d:880ms" stroke-width="2.2" d="M 700 447 L 560 400" />
    <path class="fade" style="--d:880ms" stroke-width="2.2" d="M 560 400 L 576 402 M 560 400 L 566 414" />

    <!-- AI 伙伴(右上,探头) -->
    <g class="bob">
      <path class="draw--fill draw" style="--d:950ms" pathLength="1" fill="#fff" d="M 1010 240 A 62 60 0 1 0 1011 240" />
      <path class="draw" style="--d:1060ms" pathLength="1" stroke-width="2.6" d="M 992 190 Q 996 178 1004 172" />
      <circle class="pop" style="--d:1100ms" cx="1010" cy="166" r="9" fill="#F6CB43" stroke-width="2.6" />
      <ellipse class="fade eye" style="--d:1160ms" cx="994" cy="232" rx="5" ry="6.5" fill="#141414" stroke="none" />
      <ellipse class="fade" style="--d:1190ms" cx="1026" cy="228" rx="5" ry="6.5" fill="#141414" stroke="none" />
      <path class="draw" style="--d:1220ms" pathLength="1" stroke-width="5.5" d="M 962 246 A 18 17 0 0 1 960 220" />
      <path class="draw" style="--d:1260ms" pathLength="1" stroke-width="2.6" d="M 1000 268 Q 1010 272 1020 268" />
    </g>
    <g class="spark fade" style="--d:1300ms" stroke-width="4" stroke-linecap="round">
      <path d="M 1064 150 L 1074 136" />
    </g>
    <g class="spark s2 fade" style="--d:1340ms" stroke-width="4" stroke-linecap="round">
      <path d="M 1082 176 L 1098 170" />
    </g>
    <g class="spark s3 fade" style="--d:1380ms" stroke-width="3.5" stroke-linecap="round">
      <path d="M 1068 200 L 1080 206" />
    </g>

    <!-- 键盘 -->
    <path class="dfill draw" style="--d:1450ms" pathLength="1" fill="#fff"
      d="M 340 566 Q 336 557 348 555 L 770 560 Q 784 562 782 576 L 756 636 Q 752 646 738 644 L 354 620 Q 340 618 342 604 Z" />
    <g class="fade" style="--d:1550ms" stroke-width="2.8">
      <path d="M 420 588 L 470 590 M 486 592 L 536 594 M 552 596 L 602 598 M 618 600 L 668 602" />
      <path d="M 428 612 L 478 614 M 494 616 L 544 618 M 560 620 L 610 622" />
    </g>
    <path class="fade" style="--d:1590ms" stroke-width="2.8" d="M 560 626 L 660 628" />

    <!-- 盆栽 + 咖啡 -->
    <g class="plant">
      <path class="draw--fill draw" style="--d:1650ms" pathLength="1" fill="#fff" d="M 118 560 Q 148 556 178 559 L 172 614 Q 148 618 124 614 Z" />
      <path class="draw" style="--d:1730ms" pathLength="1" stroke-width="2.8" d="M 148 558 Q 146 526 142 504" />
      <path class="draw" style="--d:1770ms" pathLength="1" stroke-width="2.8" d="M 148 558 Q 162 522 176 506" />
      <path class="draw" style="--d:1810ms" pathLength="1" stroke-width="2.8" d="M 148 558 Q 132 526 120 512" />
      <path class="pop" style="--d:1880ms" stroke-width="2.8" fill="#F6CB43" d="M 142 504 Q 130 478 140 456 Q 152 478 142 504 Z" />
    </g>
    <g class="steam">
      <path class="fade" style="--d:1950ms" stroke="#8f8f85" stroke-width="2.8" d="M 1078 540 Q 1070 528 1078 516" />
    </g>
    <g class="steam s2">
      <path class="fade" style="--d:1990ms" stroke="#8f8f85" stroke-width="2.8" d="M 1104 534 Q 1098 524 1106 514" />
    </g>
    <ellipse class="draw" style="--d:2050ms" pathLength="1" cx="1094" cy="560" rx="44" ry="11" fill="#fff" />
    <path class="draw" style="--d:2100ms" pathLength="1" fill="#fff" d="M 1050 560 Q 1048 612 1064 626 Q 1094 636 1124 626 Q 1138 612 1138 560" />
    <path class="draw" style="--d:2160ms" pathLength="1" stroke-width="2.8" d="M 1138 570 Q 1162 566 1160 588 Q 1158 606 1134 600" />
    <ellipse class="fade" style="--d:2050ms" cx="1094" cy="560" rx="33" ry="7.5" fill="#F6CB43" stroke="none" />
  </g>
  </g>
</svg>
