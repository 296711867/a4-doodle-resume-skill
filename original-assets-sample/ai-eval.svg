<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 700" width="1254" height="700">
  <!-- A6 模型评估与对齐 · 原创:天平(精度 vs 公平)+ 通过/拦截闸门 + 雷达卡 -->
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; }
    .pop { transform: scale(0.4); opacity: 0; transform-box: fill-box; transform-origin: center; }
    .fade { opacity: 0; }
    .dfill { fill-opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .draw { transition: stroke-dashoffset 0.7s cubic-bezier(0.45,0,0.35,1) var(--d,0ms); }
      .in .draw { stroke-dashoffset: 0; }
      .dfill { transition: stroke-dashoffset 0.9s cubic-bezier(0.45,0,0.35,1) var(--d,0ms), fill-opacity 0.5s ease calc(var(--d,0ms) + 300ms); }
      .in .dfill { fill-opacity: 1; }
      .fade { transition: opacity 0.6s ease var(--d,0ms); }
      .in .fade { opacity: 1; }
      .pop { transition: opacity 0.3s ease var(--d,0ms), transform 0.45s cubic-bezier(0.34,1.56,0.64,1) var(--d,0ms); }
      .in .pop { opacity: 1; transform: scale(1); }
      .in .balance { transform-origin: 627px 150px; animation: tilt 4.4s ease-in-out infinite alternate; }
      @keyframes tilt { from { transform: rotate(-2.2deg); } to { transform: rotate(2.2deg); } }
      .in .tw { animation: twinkle 2.2s ease-in-out infinite; }
      .in .tw.t2 { animation-delay: -0.7s; }
      @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
      .in .radar { animation: radar-sweep 3.2s ease-in-out infinite alternate; }
      @keyframes radar-sweep { from { transform: rotate(-40deg); } to { transform: rotate(40deg); } }
    }
  </style>
  <g id="scene-A7">
  <g fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- 天平(中上) -->
    <path class="draw" style="--d:0ms" pathLength="1" stroke-width="3.5" d="M 627 96 L 627 150" />
    <path class="draw" style="--d:120ms" pathLength="1" stroke-width="3.5" d="M 380 150 Q 500 144 627 150 Q 754 156 874 150" />
    <g class="balance">
      <!-- 左盘:accuracy -->
      <path class="draw" style="--d:300ms" pathLength="1" stroke-width="2.6" d="M 380 150 L 330 236 M 380 150 L 430 236" />
      <path class="dfill draw" style="--d:400ms" pathLength="1" fill="#fff" d="M 322 236 Q 318 228 328 228 L 432 228 Q 442 228 438 236 Q 426 268 380 268 Q 334 268 322 236 Z" />
      <text class="fade" style="--d:500ms" x="380" y="254" text-anchor="middle" font-size="20" font-weight="700" font-family="inherit" fill="#141414" stroke="none">0.98</text>
      <!-- 右盘:fairness -->
      <path class="draw" style="--d:300ms" pathLength="1" stroke-width="2.6" d="M 874 150 L 824 236 M 874 150 L 924 236" />
      <path class="dfill draw" style="--d:400ms" pathLength="1" fill="#fff" d="M 816 236 Q 812 228 822 228 L 926 228 Q 936 228 932 236 Q 920 268 874 268 Q 828 268 816 236 Z" />
      <text class="fade" style="--d:500ms" x="874" y="254" text-anchor="middle" font-size="20" font-weight="700" font-family="inherit" fill="#141414" stroke="none">fair</text>
    </g>
    <!-- 天平底座 -->
    <path class="draw" style="--d:600ms" pathLength="1" stroke-width="3.5" d="M 596 296 Q 627 268 658 296 L 676 320 L 578 320 Z" />
    <path class="draw" style="--d:660ms" pathLength="1" stroke-width="3" d="M 560 322 L 694 322" />
    <!-- 顶部星花 -->
    <g class="tw fade" style="--d:700ms" stroke-width="4">
      <path d="M 610 66 L 604 52 M 650 62 L 656 48" />
    </g>

    <!-- 闸门流程:模型 → 评估闸 → 上线/拦截 -->
    <path class="dfill draw" style="--d:800ms" pathLength="1" fill="#fff"
      d="M 100 480 Q 96 468 110 466 L 300 460 Q 314 459 316 472 L 322 550 Q 324 562 310 564 L 114 570 Q 100 570 100 556 Z" />
    <text class="fade" style="--d:900ms" x="211" y="520" text-anchor="middle" font-size="26" font-weight="700" font-family="inherit" fill="#141414" stroke="none">model v3</text>

    <path class="fade" style="--d:1000ms" stroke-width="2.6" stroke-dasharray="9 10" d="M 330 514 Q 390 512 448 512" />
    <path class="fade" style="--d:1040ms" stroke-width="2.6" d="M 448 512 L 432 504 M 448 512 L 432 520" />

    <!-- 评估闸(放大镜+勾/叉) -->
    <rect class="dfill draw" style="--d:1100ms" pathLength="1" x="452" y="440" width="220" height="150" rx="18" fill="#fff" stroke-width="4" />
    <text class="fade" style="--d:1200ms" x="562" y="474" text-anchor="middle" font-size="22" font-weight="700" font-family="inherit" fill="#141414" stroke="none">eval gate</text>
    <circle class="pop" style="--d:1280ms" cx="522" cy="530" r="24" fill="#fff" stroke-width="3.5" />
    <path class="draw" style="--d:1340ms" pathLength="1" stroke-width="3.6" d="M 512 530 L 520 540 L 536 518" />
    <circle class="pop" style="--d:1420ms" cx="606" cy="530" r="24" fill="#fff" stroke-width="3.5" />
    <path class="fade" style="--d:1480ms" stroke-width="3.6" d="M 596 520 L 616 540 M 616 520 L 596 540" />

    <!-- 通过(绿路黄勾圈)/ 拦截(灰路) -->
    <path class="fade" style="--d:1550ms" stroke-width="2.6" stroke-dasharray="9 10" d="M 676 500 Q 730 480 790 470" />
    <path class="fade" style="--d:1590ms" stroke-width="2.6" d="M 790 470 L 774 464 M 790 470 L 776 480" />
    <path class="fade" style="--d:1630ms" stroke="#8f8f85" stroke-width="2.6" stroke-dasharray="9 10" d="M 676 548 Q 730 570 786 586" />
    <path class="fade" style="--d:1670ms" stroke="#8f8f85" stroke-width="2.6" d="M 786 586 L 770 586 M 786 586 L 776 574" />

    <g class="pop" style="--d:1720ms">
      <circle cx="850" cy="458" r="30" fill="#fff" stroke-width="3.5" />
      <path d="M 836 458 L 848 470 L 866 446" stroke-width="4" />
    </g>
    <g class="pop" style="--d:1780ms" opacity="0.55">
      <circle cx="856" cy="596" r="26" fill="#fff" stroke-width="3.5" />
      <path d="M 846 586 L 866 606 M 866 586 L 846 606" stroke-width="3.5" />
    </g>

    <!-- 右侧雷达卡(评测集) -->
    <g>
      <rect class="dfill draw" style="--d:1850ms" pathLength="1" x="960" y="400" width="230" height="230" rx="16" fill="#fff" stroke-width="3.5" />
      <g class="fade" style="--d:1950ms" stroke="#8f8f85" stroke-width="2" stroke-dasharray="4 6">
        <path d="M 1075 430 L 1075 600 M 990 515 L 1160 515 M 1014 454 L 1136 576 M 1136 454 L 1014 576" />
        <circle cx="1075" cy="515" r="56" />
        <circle cx="1075" cy="515" r="28" />
      </g>
      <path class="fade radar" style="--d:2050ms" stroke="#F6CB43" stroke-width="4" d="M 1075 515 L 1075 445" />
      <circle class="pop" style="--d:2100ms" cx="1075" cy="515" r="6" fill="#141414" stroke="none" />
      <circle class="pop" style="--d:2130ms" cx="1118" cy="478" r="7" fill="#F6CB43" stroke-width="2.5" />
      <circle class="pop" style="--d:2160ms" cx="1030" cy="548" r="7" fill="#F6CB43" stroke-width="2.5" />
    </g>
  </g>
  </g>
</svg>
