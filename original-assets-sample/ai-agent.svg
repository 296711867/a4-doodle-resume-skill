<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 700" width="1254" height="700">
  <!-- A3 Agent 工具调用 · 原创:中心 Agent 芯片,环绕 搜索/计算器/数据库/API 四个工具,任务卡下发,结果回流 -->
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; }
    .pop { transform: scale(0.4); opacity: 0; transform-box: fill-box; transform-origin: center; }
    .fade { opacity: 0; }
    .dfill { fill-opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .draw { transition: stroke-dashoffset 0.7s cubic-bezier(0.45,0,0.35,1) var(--d,0ms); }
      .in .draw { stroke-dashoffset: 0; }
      .dfill { transition: stroke-dashoffset 0.9s cubic-bezier(0.45,0,0.35,1) var(--d,0ms), fill-opacity 0.5s ease calc(var(--d,0ms) + 300ms); }
      .in .dfill { fill-opacity: 1; }
      .fade { transition: opacity 0.6s ease var(--d,0ms); }
      .in .fade { opacity: 1; }
      .pop { transition: opacity 0.3s ease var(--d,0ms), transform 0.45s cubic-bezier(0.34,1.56,0.64,1) var(--d,0ms); }
      .in .pop { opacity: 1; transform: scale(1); }
      .in .core { transform-box: fill-box; transform-origin: center; animation: core-pulse 2.4s ease-in-out infinite; }
      @keyframes core-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      .in .orbit { transform-box: fill-box; transform-origin: center; animation: orbit-pulse 3s ease-in-out infinite; }
      .in .orbit.o2 { animation-delay: -1s; }
      .in .orbit.o3 { animation-delay: -2s; }
      @keyframes orbit-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
      .in .pulse { animation: pulse-run 3.2s linear infinite; }
      .in .pulse.p2 { animation-duration: 3.8s; }
      @keyframes pulse-run { to { stroke-dashoffset: -115; } }
      .in .tw { animation: twinkle 2.2s ease-in-out infinite; }
      .in .tw.t2 { animation-delay: -0.7s; }
      @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    }
  </style>
  <g id="scene-A3">
  <g fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- 任务卡(左上) -->
    <path class="dfill draw" style="--d:0ms" pathLength="1" fill="#fff" d="M 60 80 Q 56 68 70 66 L 300 60 Q 314 59 316 72 L 322 150 Q 324 162 310 164 L 140 172 L 116 200 L 114 170 Q 62 166 64 148 Z" />
    <circle class="pop" style="--d:120ms" cx="94" cy="96" r="6" fill="#F6CB43" stroke="none" />
    <path class="fade" style="--d:160ms" stroke-width="2.4" d="M 116 100 L 282 96 M 116 122 L 256 119 M 116 144 L 226 141" />

    <!-- Agent 核心(中心,旋转思维环) -->
    <g class="core">
      <rect class="dfill draw" style="--d:250ms" pathLength="1" x="560" y="270" width="140" height="120" rx="20" fill="#fff" stroke-width="4" />
      <path class="fade" style="--d:350ms" stroke-width="3" d="M 630 292 L 630 296 M 630 364 L 630 368 M 572 330 L 576 330 M 684 330 L 688 330" />
      <text class="fade" style="--d:400ms" x="630" y="342" text-anchor="middle" font-size="30" font-weight="700" font-family="inherit" fill="#141414" stroke="none">Agent</text>
    </g>
    <circle class="fade orbit" style="--d:500ms" cx="630" cy="330" r="102" stroke-width="2" stroke-dasharray="4 9" />

    <!-- 四个工具卡 -->
    <g class="orbit">
      <rect class="dfill draw" style="--d:600ms" pathLength="1" x="300" y="200" width="150" height="90" rx="14" fill="#fff" stroke-width="3.5" />
      <circle class="pop" style="--d:700ms" cx="340" cy="230" r="12" stroke-width="3" />
      <path class="fade" style="--d:740ms" stroke-width="2.6" d="M 349 239 L 360 250" />
      <path class="draw" style="--d:760ms" pathLength="1" stroke-width="2.6" d="M 366 222 L 424 220" />
    </g>
    <g class="orbit o2">
      <rect class="dfill draw" style="--d:800ms" pathLength="1" x="810" y="170" width="150" height="90" rx="14" fill="#fff" stroke-width="3.5" />
      <text class="fade" style="--d:900ms" x="345" y="0" font-size="1" fill="none" stroke="none">.</text>
      <path class="fade" style="--d:880ms" stroke-width="2.6" d="M 838 208 L 850 196 L 862 208 L 874 196 L 886 208 M 838 226 L 874 208 L 886 226" />
      <path class="draw" style="--d:900ms" pathLength="1" stroke-width="2.6" d="M 866 214 L 936 214" />
    </g>
    <g class="orbit o3">
      <rect class="dfill draw" style="--d:950ms" pathLength="1" x="300" y="420" width="150" height="90" rx="14" fill="#fff" stroke-width="3.5" />
      <ellipse class="draw" style="--d:1030ms" pathLength="1" cx="340" cy="450" rx="16" ry="6" stroke-width="2.6" />
      <path class="fade" style="--d:1070ms" stroke-width="2.4" d="M 324 450 Q 323 466 326 472 M 356 450 Q 357 466 354 472 M 324 462 Q 340 468 356 462" />
      <path class="draw" style="--d:1090ms" pathLength="1" stroke-width="2.6" d="M 368 462 L 424 464" />
    </g>
    <g class="orbit">
      <rect class="dfill draw" style="--d:1150ms" pathLength="1" x="810" y="420" width="150" height="90" rx="14" fill="#fff" stroke-width="3.5" />
      <path class="fade" style="--d:1230ms" stroke-width="2.6" d="M 838 452 Q 832 466 842 478 M 858 448 Q 850 466 862 480 M 878 448 Q 870 466 882 480" />
      <path class="draw" style="--d:1250ms" pathLength="1" stroke-width="2.6" d="M 892 464 L 936 464" />
    </g>

    <!-- 工具连线 + 双向黄脉冲 -->
    <path class="fade" style="--d:1350ms" stroke="#8f8f85" stroke-width="2.2" stroke-dasharray="8 9" d="M 452 250 Q 510 270 556 296" />
    <path class="fade pulse" style="--d:1420ms" stroke="#F6CB43" stroke-width="4.5" pathLength="100" stroke-dasharray="0.01 11" d="M 452 250 Q 510 270 556 296" />
    <path class="fade" style="--d:1390ms" stroke="#8f8f85" stroke-width="2.2" stroke-dasharray="8 9" d="M 706 292 Q 750 260 806 230" />
    <path class="fade pulse p2" style="--d:1460ms" stroke="#F6CB43" stroke-width="4.5" pathLength="100" stroke-dasharray="0.01 11" d="M 706 292 Q 750 260 806 230" />
    <path class="fade" style="--d:1430ms" stroke="#8f8f85" stroke-width="2.2" stroke-dasharray="8 9" d="M 452 462 Q 505 440 556 376" />
    <path class="fade pulse" style="--d:1500ms" stroke="#F6CB43" stroke-width="4.5" pathLength="100" stroke-dasharray="0.01 11" d="M 452 462 Q 505 440 556 376" />
    <path class="fade" style="--d:1470ms" stroke="#8f8f85" stroke-width="2.2" stroke-dasharray="8 9" d="M 706 372 Q 752 428 806 456" />
    <path class="fade pulse p2" style="--d:1540ms" stroke="#F6CB43" stroke-width="4.5" pathLength="100" stroke-dasharray="0.01 11" d="M 706 372 Q 752 428 806 456" />

    <!-- 任务卡 → Agent 下发虚线 -->
    <path class="fade" style="--d:1600ms" stroke-width="2.4" stroke-dasharray="9 10" d="M 322 170 Q 440 220 556 292" />
    <path class="fade" style="--d:1640ms" stroke-width="2.4" d="M 556 292 L 540 288 M 556 292 L 546 306" />

    <!-- 完成徽章 -->
    <g class="pop tw" style="--d:1700ms">
      <circle cx="940" cy="330" r="30" fill="#fff" stroke-width="3.5" />
      <path d="M 926 330 L 938 342 L 956 318" stroke-width="4" />
    </g>
    <g class="tw t2 fade" style="--d:1780ms" stroke-width="4" stroke-linecap="round">
      <path d="M 986 300 L 994 290 M 1000 326 L 1012 322" />
    </g>
  </g>
  </g>
</svg>
