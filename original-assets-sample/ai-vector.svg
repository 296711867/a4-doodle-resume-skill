<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 700" width="1254" height="700">
  <!-- A4 向量检索(RAG)· 原创:文档→切块→向量化→数据库,查询命中高亮近邻 -->
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; }
    .pop { transform: scale(0.4); opacity: 0; transform-box: fill-box; transform-origin: center; }
    .fade { opacity: 0; }
    .dfill { fill-opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .draw { transition: stroke-dashoffset 0.7s cubic-bezier(0.45,0,0.35,1) var(--d,0ms); }
      .in .draw { stroke-dashoffset: 0; }
      .dfill { transition: stroke-dashoffset 0.9s cubic-bezier(0.45,0,0.35,1) var(--d,0ms), fill-opacity 0.5s ease calc(var(--d,0ms) + 300ms); }
      .in .dfill { fill-opacity: 1; }
      .fade { transition: opacity 0.6s ease var(--d,0ms); }
      .in .fade { opacity: 1; }
      .pop { transition: opacity 0.3s ease var(--d,0ms), transform 0.45s cubic-bezier(0.34,1.56,0.64,1) var(--d,0ms); }
      .in .pop { opacity: 1; transform: scale(1); }
      .in .qball { transform-box: fill-box; transform-origin: center; animation: q-move 2.8s ease-in-out infinite alternate; }
      @keyframes q-move { from { transform: translate(0,0); } to { transform: translate(180px,-30px); } }
      .in .hit { transform-box: fill-box; transform-origin: center; animation: hit-glow 1.8s ease-in-out infinite alternate; }
      @keyframes hit-glow { from { opacity: 1; } to { opacity: 0.45; } }
      .in .scan { animation: scan-move 2.4s linear infinite; }
      @keyframes scan-move { to { transform: translateX(120px); } }
    }
  </style>
  <g id="scene-A4">
  <g fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- 查询气泡(左上)+ 移动的查询向量球 -->
    <path class="dfill draw" style="--d:0ms" pathLength="1" fill="#fff" d="M 70 90 Q 66 78 80 76 L 240 72 Q 254 71 256 84 L 262 150 Q 264 162 250 164 L 140 170 L 118 196 L 116 168 Q 72 164 74 148 Z" />
    <path class="fade" style="--d:140ms" stroke-width="2.2" d="M 100 106 L 226 102 M 100 128 L 204 125" />
    <path class="fade" style="--d:180ms" stroke-width="2.2" d="M 100 146 L 156 144" />
    <g class="qball">
      <circle class="pop" style="--d:260ms" cx="286" cy="196" r="13" fill="#F6CB43" stroke-width="3" />
    </g>
    <path class="fade" style="--d:300ms" stroke-width="2.2" stroke-dasharray="7 8" d="M 300 210 Q 340 260 386 300" />
    <path class="fade" style="--d:340ms" stroke-width="2.2" d="M 386 300 L 372 294 M 386 300 L 380 316" />

    <!-- 向量化模块(embedding) -->
    <rect class="dfill draw" style="--d:450ms" pathLength="1" x="390" y="270" width="190" height="110" rx="16" fill="#fff" stroke-width="3.5" />
    <text class="fade" style="--d:560ms" x="485" y="338" text-anchor="middle" font-size="28" font-weight="700" font-family="inherit" fill="#141414" stroke="none">embedding</text>

    <!-- 文档库(右上,三张卡) -->
    <g class="draw" style="--d:700ms">
      <rect pathLength="1" x="760" y="90" width="120" height="150" rx="10" fill="#fff" stroke-width="3" />
      <path stroke-width="2.2" d="M 780 120 L 862 118 M 780 146 L 850 144 M 780 172 L 862 170" />
      <rect pathLength="1" x="800" y="110" width="120" height="150" rx="10" fill="#fff" stroke-width="3" />
      <path stroke-width="2.2" d="M 820 140 L 902 138 M 820 166 L 892 164 M 820 192 L 902 190" />
      <rect pathLength="1" x="840" y="130" width="120" height="150" rx="10" fill="#fff" stroke-width="3" />
      <path stroke-width="2.2" d="M 860 160 L 942 158 M 860 186 L 934 184 M 860 212 L 942 210" />
    </g>
    <path class="fade scan" style="--d:900ms" stroke="#8f8f85" stroke-width="2.2" stroke-dasharray="5 7" d="M 845 140 L 845 272" />
    <path class="fade" style="--d:940ms" stroke-width="2.2" stroke-dasharray="8 9" d="M 966 200 Q 1010 240 1036 280" />
    <path class="fade" style="--d:980ms" stroke-width="2.2" d="M 1036 280 L 1022 274 M 1036 280 L 1030 296" />

    <!-- 向量数据库(右下) -->
    <g class="draw" style="--d:1050ms">
      <ellipse pathLength="1" cx="1105" cy="330" rx="90" ry="26" fill="#fff" stroke-width="3.5" />
      <path stroke-width="3" fill="#fff" d="M 1015 330 L 1015 450 Q 1105 478 1195 450 L 1195 330 Q 1105 356 1015 330 Z" />
      <path stroke-width="2.4" d="M 1015 375 Q 1105 400 1195 373 M 1016 420 Q 1105 444 1194 418" />
    </g>
    <!-- 库内向量点(近邻高亮) -->
    <circle class="pop" style="--d:1200ms" cx="1060" cy="395" r="6" fill="#141414" stroke="none" />
    <circle class="pop" style="--d:1230ms" cx="1105" cy="420" r="6" fill="#141414" stroke="none" />
    <circle class="pop hit" style="--d:1260ms" cx="1148" cy="388" r="9" fill="#F6CB43" stroke="#141414" stroke-width="2.5" />
    <circle class="pop" style="--d:1290ms" cx="1084" cy="440" r="6" fill="#141414" stroke="none" />
    <circle class="pop" style="--d:1320ms" cx="1160" cy="430" r="6" fill="#141414" stroke="none" />

    <!-- 查询向量 → 库:命中连线 -->
    <path class="fade" style="--d:1380ms" stroke-width="2.2" stroke-dasharray="7 8" d="M 580 330 Q 800 330 1050 380" />
    <path class="fade" style="--d:1420ms" stroke-width="2.2" d="M 1050 380 L 1036 372 M 1050 380 L 1040 394" />

    <!-- 底部:回答条(生成) -->
    <path class="dfill draw" style="--d:1500ms" pathLength="1" fill="#fff" d="M 380 560 Q 376 548 390 546 L 880 540 Q 894 539 896 552 L 902 608 Q 904 620 890 622 L 480 630 L 452 658 L 450 628 Q 382 624 384 606 Z" />
    <path class="fade" style="--d:1660ms" stroke-width="2.2" d="M 416 578 L 836 572 M 416 598 L 780 574" />
    <rect class="pop" style="--d:1720ms" x="416" y="602" width="70" height="16" rx="8" fill="#F6CB43" stroke="none" />
    <path class="fade" style="--d:1760ms" stroke-width="2.2" stroke-dasharray="7 8" d="M 1105 486 Q 1000 540 906 576" />
    <path class="fade" style="--d:1800ms" stroke-width="2.2" d="M 906 576 L 922 574 M 906 576 L 914 590" />
  </g>
  </g>
</svg>
